{% extends "base.html" %}

{% block title %}Login - CineApp{% endblock %}

{% block content %}
<div class="bg-slate-800 p-8 rounded-xl shadow-2xl w-full max-w-sm border border-slate-700">
    <h2 class="text-2xl font-bold mb-6 text-center text-amber-400">🎬 CineApp Login</h2>
    
    <form method="POST" class="space-y-4">
        <div>
            <label class="block text-sm font-medium text-slate-300 mb-1">Usuário</label>
            <input type="text" name="username" required 
                   class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-slate-100 focus:outline-none focus:border-amber-400"
                   placeholder="Ex: admin">
        </div>
        <div>
            <label class="block text-sm font-medium text-slate-300 mb-1">Senha</label>
            <input type="password" name="password" required 
                   class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-slate-100 focus:outline-none focus:border-amber-400"
                   placeholder="••••••••">
        </div>
        <button type="submit" 
                class="w-full py-2 bg-amber-500 hover:bg-amber-600 text-slate-950 font-semibold rounded-lg transition duration-200">
            Entrar
        </button>
    </form>
    
    <!-- Contas de teste -->
    <div class="mt-4 text-xs text-slate-400 text-center border-t border-slate-700/50 pt-3">
        <p>Contas de teste:</p>
        <p class="text-slate-500">`admin` / `123456` ou `critico` / `oscar2026`</p>
    </div>

    <!-- Link para registo -->
    <div class="mt-4 text-xs text-slate-400 text-center">
        <p>Não tem conta? <a href="{{ url_for('auth.register') }}" class="text-amber-400 hover:underline">Registra-se aqui</a></p>
    </div>
</div>
{% endblock %}
